<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#17324d}.h{font-size:25px;font-weight:700}.s{font-size:17px}.n{font-size:22px;font-weight:700;fill:#fff}.box{fill:#f7fbff;stroke:#5a9bd5;stroke-width:2}.num{fill:#2f80c9}.arrow{stroke:#7c93a8;stroke-width:4;fill:none;marker-end:url(#m)}.warn{fill:#fff7e8;stroke:#e6a23c;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c93a8"/></marker></defs>
  <rect width="1400" height="430" rx="18" fill="#eef5fb"/>
  <text x="700" y="50" text-anchor="middle" class="t h">v4.0 / v5.0 批量导入：从勘探到失败回捞</text>
  <g transform="translate(35,95)"><rect class="box" width="205" height="175" rx="14"/><circle class="num" cx="30" cy="30" r="20"/><text class="n" x="30" y="38" text-anchor="middle">1</text><text class="t h" x="103" y="79" text-anchor="middle">勾选批量导入</text><text class="t s" x="103" y="121" text-anchor="middle">再执行问卷勘探</text></g><path class="arrow" d="M248 183 H267"/>
  <g transform="translate(275,95)"><rect class="box" width="205" height="175" rx="14"/><circle class="num" cx="30" cy="30" r="20"/><text class="n" x="30" y="38" text-anchor="middle">2</text><text class="t h" x="103" y="79" text-anchor="middle">编辑主表</text><text class="t s" x="103" y="121" text-anchor="middle">选“批量导入”</text><text class="t s" x="103" y="149" text-anchor="middle">预设答案留空</text></g><path class="arrow" d="M488 183 H507"/>
  <g transform="translate(515,95)"><rect class="box" width="205" height="175" rx="14"/><circle class="num" cx="30" cy="30" r="20"/><text class="n" x="30" y="38" text-anchor="middle">3</text><text class="t h" x="103" y="79" text-anchor="middle">填写子表</text><text class="t s" x="103" y="121" text-anchor="middle">第 4 行起每行一份</text><text class="t s" x="103" y="149" text-anchor="middle">多项用英文 ;</text></g><path class="arrow" d="M728 183 H747"/>
  <g transform="translate(755,95)"><rect class="box" width="205" height="175" rx="14"/><circle class="num" cx="30" cy="30" r="20"/><text class="n" x="30" y="38" text-anchor="middle">4</text><text class="t h" x="103" y="79" text-anchor="middle">交叉预检查</text><text class="t s" x="103" y="121" text-anchor="middle">模式 · 行数 · 必答</text><text class="t s" x="103" y="149" text-anchor="middle">来源字段（v5.0）</text></g><path class="arrow" d="M968 183 H987"/>
  <g transform="translate(995,95)"><rect class="box" width="205" height="175" rx="14"/><circle class="num" cx="30" cy="30" r="20"/><text class="n" x="30" y="38" text-anchor="middle">5</text><text class="t h" x="103" y="79" text-anchor="middle">逐行运行</text><text class="t s" x="103" y="121" text-anchor="middle">同一行重试不换数据</text><text class="t s" x="103" y="149" text-anchor="middle">最多 3 次尝试</text></g><path class="arrow" d="M1208 183 H1227"/>
  <g transform="translate(1235,95)"><rect class="box" width="130" height="175" rx="14"/><circle class="num" cx="28" cy="30" r="20"/><text class="n" x="28" y="38" text-anchor="middle">6</text><text class="t h" x="65" y="79" text-anchor="middle">核对</text><text class="t s" x="65" y="121" text-anchor="middle">日志</text><text class="t s" x="65" y="149" text-anchor="middle">失败表</text></g>
  <rect class="warn" x="165" y="315" width="1070" height="72" rx="12"/><text x="700" y="345" text-anchor="middle" class="t s">v4.0 子表首列是“序号”；v5.0 前两列是“题目名称 / 填写来源”</text><text x="700" y="373" text-anchor="middle" class="t s">运行前关闭 Excel；提交次数或断点结束序号不得超过实际数据条数</text>
</svg>
