<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#17324d}.title{font-size:28px;font-weight:700}.h{font-size:23px;font-weight:700}.s{font-size:17px}.box{fill:#f7fbff;stroke:#5a9bd5;stroke-width:2}.pill{fill:#e8f3fc;stroke:#8bbbe3;stroke-width:1.5}.arrow{stroke:#7c93a8;stroke-width:4;fill:none;marker-end:url(#m)}.warn{fill:#fff7e8;stroke:#e6a23c;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c93a8"/></marker></defs>
  <rect width="1400" height="560" rx="18" fill="#eef5fb"/><text x="700" y="48" text-anchor="middle" class="t title">v5.0 三项关键配置：来源、逻辑题、断点作答</text>
  <g transform="translate(45,85)"><rect class="box" width="400" height="385" rx="16"/><text x="200" y="48" text-anchor="middle" class="t h">① 模拟来源</text><rect class="pill" x="35" y="80" width="330" height="48" rx="12"/><text x="200" y="110" text-anchor="middle" class="t s">链接来源 / 微信来源 / 混合来源</text><path class="arrow" d="M200 140 V173"/><rect class="pill" x="35" y="185" width="330" height="62" rx="12"/><text x="200" y="211" text-anchor="middle" class="t s">按界面选项设置填写来源</text><text x="200" y="236" text-anchor="middle" class="t s">混合来源：按设定比例分配</text><path class="arrow" d="M200 260 V293"/><rect class="warn" x="35" y="305" width="330" height="50" rx="12"/><text x="200" y="336" text-anchor="middle" class="t s">“自行设置”仅在批量导入时出现</text></g>
  <g transform="translate(500,85)"><rect class="box" width="400" height="385" rx="16"/><text x="200" y="48" text-anchor="middle" class="t h">② 存在逻辑题</text><rect class="pill" x="35" y="80" width="330" height="48" rx="12"/><text x="200" y="110" text-anchor="middle" class="t s">勾选“存在逻辑题”</text><path class="arrow" d="M200 140 V173"/><rect class="pill" x="35" y="185" width="330" height="62" rx="12"/><text x="200" y="211" text-anchor="middle" class="t s">自动联动“存在非必答题”</text><text x="200" y="236" text-anchor="middle" class="t s">勘探时显示并抓取隐藏题</text><path class="arrow" d="M200 260 V293"/><rect class="warn" x="35" y="305" width="330" height="50" rx="12"/><text x="200" y="336" text-anchor="middle" class="t s">统一写入 Main_Branch 主表</text></g>
  <g transform="translate(955,85)"><rect class="box" width="400" height="385" rx="16"/><text x="200" y="48" text-anchor="middle" class="t h">③ 开启断点作答</text><rect class="pill" x="35" y="80" width="330" height="48" rx="12"/><text x="200" y="110" text-anchor="middle" class="t s">设置起始序号与结束序号</text><path class="arrow" d="M200 140 V173"/><rect class="pill" x="35" y="185" width="330" height="62" rx="12"/><text x="200" y="211" text-anchor="middle" class="t s">例如 10–50 = 第 10 至 50 条数据</text><text x="200" y="236" text-anchor="middle" class="t s">共运行 41 条</text><path class="arrow" d="M200 260 V293"/><rect class="warn" x="35" y="305" width="330" height="50" rx="12"/><text x="200" y="336" text-anchor="middle" class="t s">第 1 条数据位于 Excel 第 4 行</text></g>
  <text x="700" y="520" text-anchor="middle" class="t s">折叠栏默认只展开“核心配置”；点击“问卷特征”或“自动填写策略”标题即可展开</text>
</svg>
