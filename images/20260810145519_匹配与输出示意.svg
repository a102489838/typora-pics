<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#17324d}.h{font-size:28px;font-weight:700}.m{font-size:22px;font-weight:700}.s{font-size:19px}.card{fill:#fff;stroke:#7aa7cf;stroke-width:2}.ok{fill:#eaf7ee;stroke:#51a86b;stroke-width:2}.warn{fill:#fff4e5;stroke:#e59a2f;stroke-width:2}.arrow{stroke:#6f889e;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f889e"/></marker></defs>
  <rect width="1400" height="600" rx="18" fill="#eef5fb"/><text x="700" y="48" text-anchor="middle" class="t h">匹配规则与输出目录示意</text>
  <rect class="card" x="50" y="95" width="350" height="190" rx="14"/><text class="t m" x="225" y="135" text-anchor="middle">JPG 源文件夹</text><text class="t s" x="90" y="180">IMG_1001.JPG</text><text class="t s" x="90" y="220">IMG_1003_精修.JPG</text><text class="t s" x="90" y="260">IMG_2000.JPG</text>
  <rect class="card" x="525" y="95" width="350" height="190" rx="14"/><text class="t m" x="700" y="135" text-anchor="middle">RAW 目标文件夹（含子目录）</text><text class="t s" x="565" y="180">IMG_1001.CR3</text><text class="t s" x="565" y="220">IMG_1003.NEF</text><text class="t s" x="565" y="260">IMG_3000.ARW</text>
  <path class="arrow" d="M400 190 H512"/><text class="t s" x="455" y="165" text-anchor="middle">按基础名</text>
  <rect class="ok" x="1000" y="95" width="350" height="190" rx="14"/><text class="t m" x="1175" y="135" text-anchor="middle">精确匹配输出</text><text class="t s" x="1040" y="180">IMG_1001.JPG</text><text class="t s" x="1040" y="220">IMG_1001.CR3</text><text class="t s" x="1040" y="260">其余按设置处理</text><path class="arrow" d="M875 190 H987"/>
  <rect class="card" x="50" y="350" width="400" height="175" rx="14"/><text class="t m" x="250" y="392" text-anchor="middle">v2.0 模糊匹配</text><text class="t s" x="90" y="438">IMG_1003_精修.JPG</text><text class="t s" x="90" y="478">可匹配 IMG_1003.NEF</text><text class="t s" x="90" y="510">英文/数字后缀可填入忽略词</text>
  <rect class="warn" x="525" y="350" width="350" height="175" rx="14"/><text class="t m" x="700" y="392" text-anchor="middle">未匹配源文件</text><text class="t s" x="565" y="438">IMG_2000.JPG</text><text class="t s" x="565" y="478">→ 未匹配RAW的JPG文件/</text><text class="t s" x="565" y="510">是否归档取决于输出选项</text>
  <rect class="ok" x="950" y="350" width="400" height="175" rx="14"/><text class="t m" x="1150" y="392" text-anchor="middle">v2.0 非空输出目录</text><text class="t s" x="990" y="438">输出文件夹/</text><text class="t s" x="1020" y="478">└─ 匹配输出_年月日_时分秒/</text><text class="t s" x="1020" y="510">   ├─ 匹配文件　└─ 未匹配归档</text>
</svg>
